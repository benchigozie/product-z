services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: productz
      POSTGRES_PASSWORD: productz_dev
      POSTGRES_DB: productz
    ports:
      - "5433:5432"
    volumes:
      - product-z-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: product-z-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - product-z-redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  product-z-postgres-data:
  product-z-redis-data: